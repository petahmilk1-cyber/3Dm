<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Multiplayer Arena</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --accent: #4f9dff;
    --accent-2: #ff6b6b;
    --text: #e7e9ee;
    --muted: #8a92a3;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* ---------- Lobby ---------- */
  #lobby {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #lobby-card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #lobby-card h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  #lobby-card .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input[type="text"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .field { margin-bottom: 16px; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: transparent; color: var(--accent-2); border: 1px solid rgba(255,107,107,0.4); }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

  #create-form { display: flex; gap: 8px; margin-bottom: 22px; }
  #create-form input { flex: 1; }

  hr.sep { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  #games-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .game-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 10px 12px; border-radius: 10px;
  }
  .game-name { flex: 1; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }

  /* ---------- Game ---------- */
  #game { display: none; height: 100%; position: relative; overflow: hidden; }
  #scene { position: absolute; inset: 0; display: block; }

  #hud {
    position: absolute; top: 14px; left: 14px;
    background: rgba(15,17,21,0.7);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(6px);
  }
  #game-name-label { font-weight: 700; font-size: 14px; }
  #controls-hint { color: var(--muted); font-size: 11px; }

  #chat {
    position: absolute; left: 14px; bottom: 14px;
    width: 300px;
    background: rgba(15,17,21,0.75);
    border: 1px solid var(--border);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #chat-log {
    max-height: 180px; overflow-y: auto;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
    font-size: 13px;
  }
  .chat-msg { line-height: 1.35; word-break: break-word; }
  .chat-msg strong { color: var(--accent); }
  #chat-form { display: flex; border-top: 1px solid var(--border); }
  #chat-input {
    flex: 1; background: transparent; border: none; color: var(--text);
    padding: 10px 12px; font-size: 13px; outline: none;
  }
  #chat-form button {
    border-radius: 0; background: var(--accent); color: #fff; padding: 10px 14px;
  }
</style>
</head>
<body>

  <!-- LOBBY -->
  <div id="lobby">
    <div id="lobby-card">
      <h1>3D Multiplayer Arena</h1>
      <div class="subtitle">Create a game, join one, or clear out old ones.</div>

      <div class="field">
        <label for="player-name">Your name</label>
        <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />
      </div>

      <form id="create-form">
        <input type="text" id="create-name" placeholder="New game name" maxlength="40" />
        <button type="submit" class="btn-primary">Create</button>
      </form>

      <hr class="sep" />

      <label>Active games</label>
      <div id="games-list">
        <div class="empty">Loading…</div>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game">
    <canvas id="scene"></canvas>

    <div id="hud">
      <span id="game-name-label"></span>
      <span id="controls-hint">WASD to move &middot; A/D to turn</span>
      <button id="leave-btn" class="btn-secondary">Leave</button>
    </div>

    <div id="chat">
      <div id="chat-log"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Say something…" maxlength="200" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="client.js"></script>
</body>
</html>
